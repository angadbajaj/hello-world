<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - QuoteSmith</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top"><a class="logo" href="/">Quote<span>Smith</span></a></header>
    <form id="form" class="card" style="max-width:420px;margin:24px auto">
      <h2 style="margin-top:0" id="heading">Create your free account</h2>
      <p class="muted" id="sub">3 free quotes a month. No card needed.</p>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required />
      <label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required />
      <p class="error" id="err"></p>
      <button class="btn" id="go" type="submit" style="width:100%">Create account</button>
      <p class="muted" style="text-align:center"><a href="#" id="toggle">Already have an account? Log in</a></p>
      <p class="muted hidden" style="text-align:center" id="forgotWrap"><a href="#" id="forgot">Forgot your password?</a></p>
    </form>
    <form id="forgotForm" class="card hidden" style="max-width:420px;margin:24px auto">
      <h2 style="margin-top:0">Reset your password</h2>
      <p class="muted">Enter your account email and we'll send you a link to choose a new password.</p>
      <label for="forgotEmail">Email</label><input id="forgotEmail" type="email" autocomplete="email" required />
      <p id="forgotMsg" class="muted"></p>
      <button class="btn" type="submit" style="width:100%">Send reset link</button>
      <p class="muted" style="text-align:center"><a href="#login" id="backToLogin">Back to log in</a></p>
    </form>
  </div>
<script type="module">
import { api, getMe } from "/nav.js";
const $ = (id) => document.getElementById(id);
const next = new URLSearchParams(location.search).get("next");
const dest = next && next.startsWith("/") && !next.startsWith("//") ? next : "/dashboard";
let mode = location.hash === "#login" ? "login" : "signup";

function setMode(m) {
  mode = m;
  const login = m === "login";
  $("heading").textContent = login ? "Welcome back" : "Create your free account";
  $("sub").textContent = login ? "Log in to your quotes." : "3 free quotes a month. No card needed.";
  $("go").textContent = login ? "Log in" : "Create account";
  $("password").autocomplete = login ? "current-password" : "new-password";
  $("toggle").textContent = login ? "New here? Create a free account" : "Already have an account? Log in";
  $("err").textContent = "";
  $("forgotWrap").classList.toggle("hidden", !login);
}
$("toggle").onclick = (e) => { e.preventDefault(); setMode(mode === "login" ? "signup" : "login"); };
setMode(mode);

getMe().then((me) => me.user && location.replace(dest));

$("forgot").onclick = (e) => {
  e.preventDefault();
  $("forgotEmail").value = $("email").value;
  $("form").classList.add("hidden"); $("forgotForm").classList.remove("hidden"); $("forgotEmail").focus();
};
$("backToLogin").onclick = (e) => {
  e.preventDefault();
  $("forgotForm").classList.add("hidden"); $("form").classList.remove("hidden"); setMode("login");
};
$("forgotForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/password/forgot", { method: "POST", body: { email: $("forgotEmail").value } });
    $("forgotMsg").textContent = "If that email has an account, a reset link is on its way. Check your inbox (and spam).";
  } catch (err) { $("forgotMsg").textContent = err.message; }
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  try {
    await api(mode === "login" ? "/api/login" : "/api/signup", { method: "POST", body: { email: $("email").value, password: $("password").value } });
    location.href = dest;
  } catch (err) {
    $("err").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
