<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - QuoteSmith</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top"><a class="logo" href="/">Quote<span>Smith</span></a><nav id="nav"></nav></header>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Your quotes</h2>
        <div id="usage" class="muted"></div>
      </div>
      <div id="stats" class="stats"></div>
      <div id="list"><p class="muted">Loading...</p></div>
    </div>

    <div id="plan" class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Plan</h2>
      <div id="planBody" class="muted">Loading...</div>
      <p class="error" id="planError"></p>
    </div>

    <div id="logoCard" class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Your logo</h2>
      <div id="logoBody"></div>
      <p class="error" id="logoError"></p>
    </div>

    <form id="profile" class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Business profile</h2>
      <p class="muted">These details are filled in on every new quote.</p>
      <div class="grid">
        <div><label for="businessName">Business name</label><input id="businessName" /></div>
        <div><label for="trade">Trade</label><input id="trade" /></div>
        <div><label for="location">City / region</label><input id="location" /></div>
        <div><label for="phone">Phone</label><input id="phone" type="tel" /></div>
        <div><label for="email">Business email</label><input id="email" type="email" /></div>
      </div>
      <div class="grid">
        <div><label for="hourlyRate">Hourly rate</label><input id="hourlyRate" type="number" min="0" step="1" /></div>
        <div><label for="markup">Materials markup %</label><input id="markup" type="number" min="0" step="1" /></div>
        <div><label for="taxRate">Tax %</label><input id="taxRate" type="number" min="0" step="0.01" /></div>
        <div><label for="currency">Currency</label>
          <select id="currency"><option>USD</option><option>CAD</option><option>GBP</option><option>EUR</option><option>AUD</option><option>NZD</option></select></div>
      </div>
      <label for="terms">Standard terms</label><textarea id="terms" style="min-height:80px"></textarea>
      <h3>Getting paid</h3>
      <div class="grid">
        <div><label for="depositPercent">Deposit to book (%)</label><input id="depositPercent" type="number" min="0" max="100" step="1" placeholder="0" /></div>
        <div style="grid-column: span 2"><label for="paymentLink">Payment link (Stripe, Square, PayPal...)</label><input id="paymentLink" type="url" placeholder="https://buy.stripe.com/..." /></div>
      </div>
      <p class="muted" style="font-size:.9rem">When a customer accepts, they're shown the deposit amount and a "Pay deposit" button that opens this link.</p>
      <div class="row" style="margin-top:12px">
        <button class="btn" type="submit">Save profile</button><span id="saved" class="muted"></span>
      </div>
    </form>

    <p class="muted" style="margin-top:16px"><span id="who"></span> · <a href="#" id="logout">Log out</a></p>
  </div>
<script type="module">
import { api, renderNav, getMe, logout } from "/nav.js";
import { esc, money, totals } from "/quote-render.js";
const $ = (id) => document.getElementById(id);
const FIELDS = ["businessName", "trade", "location", "phone", "email", "hourlyRate", "markup", "taxRate", "currency", "terms", "depositPercent", "paymentLink"];

const me = await getMe();
if (!me.user) {
  location.replace(`/login?next=${encodeURIComponent(location.pathname + location.search)}`);
  await new Promise(() => {}); // stop here while the browser navigates away
}
renderNav(me);
$("who").textContent = `Signed in as ${me.user.email} (${me.user.plan} plan)`;
$("logout").onclick = (e) => { e.preventDefault(); logout(); };
for (const f of FIELDS) if (me.user.profile[f] != null) $(f).value = me.user.profile[f];

const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${Math.max(m, 1)}m ago`;
  if (m < 1440) return `${Math.round(m / 60)}h ago`;
  return new Date(iso).toLocaleDateString();
};

function statusOf(q) {
  if (q.status === "sent" && q.viewedAt) return { cls: "viewed", label: `viewed ${ago(q.viewedAt)}` };
  if (q.status === "accepted" || q.status === "declined") return { cls: q.status, label: `${q.status} ${ago(q.respondedAt)}` };
  return { cls: q.status, label: q.status };
}

const { quotes, usage } = await api("/api/quotes");
$("usage").textContent = usage.limit === null ? "Unlimited quotes" : `${usage.used} of ${usage.limit} free quotes used this month`;
if (usage.limit !== null && usage.used >= usage.limit) $("usage").innerHTML += ` · <a href="#plan">Upgrade</a>`;

const accepted = quotes.filter((q) => q.status === "accepted");
const sent = quotes.filter((q) => q.status !== "draft");
const valueOf = (q) => totals(q.quote, q.input).total;
const cur = me.user.profile.currency || "USD";
if (sent.length) {
  $("stats").innerHTML = `
    <div><strong>${sent.length}</strong><span class="muted">sent</span></div>
    <div><strong>${sent.length ? Math.round((accepted.length / sent.length) * 100) : 0}%</strong><span class="muted">win rate</span></div>
    <div><strong>${money(accepted.reduce((s, q) => s + valueOf(q), 0), cur)}</strong><span class="muted">won</span></div>`;
}

$("list").innerHTML = quotes.length
  ? `<table class="items dash"><thead><tr><th>Quote</th><th>Customer</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>
    ${quotes.map((q) => { const s = statusOf(q); return `<tr>
      <td><a href="/app?id=${q.id}">${esc(q.quote.title)}</a><div class="muted" style="font-size:.85rem">${q.number ? `#${q.number} · ` : ""}${new Date(q.createdAt).toLocaleDateString()}</div></td>
      <td>${esc(q.input.customerName || "-")}</td>
      <td class="num">${money(valueOf(q), q.input.currency || "USD")}</td>
      <td><span class="status ${s.cls}">${esc(s.label)}</span></td>
      <td>${q.status !== "draft" ? `<a href="/q/${q.id}">Customer view</a>` : ""}</td></tr>`; }).join("")}
    </tbody></table>`
  : `<p class="muted">No quotes yet. <a href="/app">Write your first one</a>, it takes about a minute.</p>`;

// ---- plan & billing ----
const PLANS = {
  pro: { name: "Pro", price: "$19/mo", pitch: "Unlimited quotes, your logo on quotes and PDFs, no QuoteSmith branding, open alerts." },
  crew: { name: "Crew", price: "$49/mo", pitch: "Up to 5 users and a shared price book." },
};
const params = new URLSearchParams(location.search);

function renderPlan(user, billing) {
  const plan = user.plan;
  const status = user.planStatus && user.planStatus !== "active" ? ` (${user.planStatus.replace("_", " ")})` : "";
  let html = `<p>You're on the <strong>${plan === "free" ? "Free" : PLANS[plan]?.name || plan}</strong> plan${esc(status)}.</p>`;
  if (user.planStatus === "past_due") html += `<p class="notice">Your last payment failed. Update your card to keep Pro.</p>`;
  if (plan === "free") {
    const offers = (billing?.plans || []).filter((p) => PLANS[p]);
    html += offers.length
      ? `<div class="features">${offers.map((p) => `<div class="card plan ${p === "pro" ? "featured" : ""}">
          <h3 style="margin:0">${PLANS[p].name} <span class="muted">${PLANS[p].price}</span></h3>
          <p class="muted">${PLANS[p].pitch}</p>
          <button class="btn" data-upgrade="${p}">${billing.trialDays ? `Start ${billing.trialDays}-day free trial` : `Upgrade to ${PLANS[p].name}`}</button></div>`).join("")}</div>`
      : `<p class="muted">Paid plans are coming soon.</p>`;
  }
  if (user.stripeCustomerId && billing?.enabled) html += `<p><button class="btn ghost" id="portal">Manage billing &amp; invoices</button></p>`;
  $("planBody").innerHTML = html;
  $("planBody").classList.remove("muted");
}

async function go(url, body) {
  $("planError").textContent = "";
  try {
    const { url: dest } = await api(url, { method: "POST", body });
    location.href = dest;
  } catch (err) { $("planError").textContent = err.message; }
}
$("planBody").addEventListener("click", (e) => {
  if (e.target.dataset.upgrade) { e.target.disabled = true; go("/api/billing/checkout", { plan: e.target.dataset.upgrade }); }
  if (e.target.id === "portal") go("/api/billing/portal");
});
renderPlan(me.user, me.billing);

// Arriving from the pricing page: go straight to checkout.
const wanted = params.get("upgrade");
if (wanted && me.user.plan === "free" && me.billing?.plans.includes(wanted)) go("/api/billing/checkout", { plan: wanted });
else if (wanted) $("plan").scrollIntoView();

// Back from Stripe: the webhook may land a moment after the redirect, so poll briefly.
if (params.get("upgraded")) {
  $("planBody").insertAdjacentHTML("beforebegin", `<p class="notice" id="thanks">Thanks! Activating your plan...</p>`);
  for (let i = 0; i < 10; i++) {
    const fresh = await getMe();
    if (fresh.user?.plan !== "free") {
      $("thanks").textContent = "You're all set. Unlimited quotes are on.";
      renderPlan(fresh.user, fresh.billing);
      $("usage").textContent = "Unlimited quotes";
      break;
    }
    await new Promise((r) => setTimeout(r, 1500));
  }
  history.replaceState(null, "", "/dashboard");
}

// ---- logo ----
function renderLogo(user) {
  if (user.plan === "free") {
    $("logoBody").innerHTML = `<p class="muted">Put your logo on every quote and PDF, and remove the QuoteSmith branding. <a href="#plan">Pro feature</a>.</p>`;
    return;
  }
  $("logoBody").innerHTML = `
    ${user.hasLogo ? `<img src="/api/me/logo?t=${Date.now()}" alt="Your logo" class="logo-img" />` : `<p class="muted">PNG or JPEG. It appears on your quotes and PDFs.</p>`}
    <div class="row"><label class="btn ghost" style="margin:0">${user.hasLogo ? "Replace" : "Upload logo"}<input type="file" id="logoFile" accept="image/png,image/jpeg" hidden /></label>
    ${user.hasLogo ? `<button class="btn ghost" id="logoRemove" type="button">Remove</button>` : ""}</div>`;
}

// Downscale in the browser so uploads stay small and fast.
function toDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 600 / img.width, 240 / img.height);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(file.type === "image/jpeg" ? "image/jpeg" : "image/png", 0.9));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("That file isn't an image we can read."));
    img.src = URL.createObjectURL(file);
  });
}

$("logoBody").addEventListener("change", async (e) => {
  if (e.target.id !== "logoFile" || !e.target.files[0]) return;
  $("logoError").textContent = "";
  try {
    await api("/api/me/logo", { method: "PUT", body: { dataUrl: await toDataUrl(e.target.files[0]) } });
    me.user.hasLogo = true; renderLogo(me.user);
  } catch (err) { $("logoError").textContent = err.message; }
});
$("logoBody").addEventListener("click", async (e) => {
  if (e.target.id !== "logoRemove") return;
  await api("/api/me/logo", { method: "DELETE" });
  me.user.hasLogo = false; renderLogo(me.user);
});
renderLogo(me.user);

$("profile").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/me/profile", { method: "PUT", body: Object.fromEntries(FIELDS.map((f) => [f, $(f).value])) });
    $("saved").textContent = "Saved";
  } catch (err) { $("saved").textContent = err.message; }
};
</script>
</body>
</html>
