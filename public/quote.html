<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your quote</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap" style="padding-top:24px">
    <div class="card" id="root"><p class="muted">Loading quote...</p></div>
    <div class="card no-print hidden" id="respond" style="margin-top:16px">
      <h3 style="margin-top:0">Ready to go ahead?</h3>
      <label for="name">Your full name</label><input id="name" autocomplete="name" />
      <label for="note">Note for the contractor (optional)</label><textarea id="note" style="min-height:70px"></textarea>
      <p class="error" id="err"></p>
      <div class="row">
        <button class="btn" id="accept">Accept quote</button>
        <button class="btn ghost" id="decline">Decline</button>
        <button class="btn ghost" onclick="window.print()">Print / PDF</button>
      </div>
    </div>
    <footer>Quote made with <a href="/">QuoteSmith</a></footer>
  </div>
<script type="module">
import { esc, money, totals, lineTotal, listHtml } from "/quote-render.js";
const id = location.pathname.split("/").pop();
const $ = (x) => document.getElementById(x);

function render(rec) {
  const { quote: q, input } = rec; const cur = input.currency || "USD";
  const t = totals(q, { markup: input.markup, taxRate: input.taxRate });
  document.title = `${q.title} - ${input.businessName || "Quote"}`;
  $("root").innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><strong>${esc(input.businessName || input.trade || "")}</strong><div class="muted">${esc(input.location || "")}</div></div>
      <span class="status ${rec.status}">${rec.status === "sent" ? "awaiting response" : rec.status}</span>
    </div>
    <h1 style="margin-bottom:4px">${esc(q.title)}</h1>
    <p class="muted">${input.customerName ? `Prepared for ${esc(input.customerName)} · ` : ""}${new Date(rec.updatedAt || rec.createdAt).toLocaleDateString()}</p>
    <p>${esc(q.summary)}</p>
    <table class="items"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead>
    <tbody>${q.line_items.map((li) => `<tr><td>${esc(li.description)}</td><td class="num">${li.quantity} ${esc(li.unit)}</td>
      <td class="num">${money(li.unit_price, cur)}</td><td class="num">${money(lineTotal(li, input.markup), cur)}</td></tr>`).join("")}</tbody></table>
    <div class="totals" style="margin-top:12px">
      <div><span>Subtotal</span><span>${money(t.subtotal, cur)}</span></div>
      ${t.tax ? `<div><span>Tax (${input.taxRate}%)</span><span>${money(t.tax, cur)}</span></div>` : ""}
      <div class="grand"><span>Total</span><span>${money(t.total, cur)}</span></div>
    </div>
    ${q.estimated_duration ? `<p><strong>Estimated duration:</strong> ${esc(q.estimated_duration)}</p>` : ""}
    ${listHtml("Scope of work", q.scope_of_work)}${listHtml("Not included", q.exclusions)}
    ${listHtml("Assumptions", q.assumptions)}${listHtml("Terms", q.terms)}
    ${rec.respondedAt ? `<p><strong>${rec.status === "accepted" ? "Accepted" : "Declined"}</strong> by ${esc(rec.signature)} on ${new Date(rec.respondedAt).toLocaleString()}</p>` : ""}`;
  $("respond").classList.toggle("hidden", rec.status === "accepted" || rec.status === "declined");
}

async function respond(decision) {
  $("err").textContent = "";
  if (decision === "accept" && $("name").value.trim().length < 2) { $("err").textContent = "Please type your name to accept."; return; }
  const r = await fetch(`/api/q/${id}/respond`, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ decision, name: $("name").value, note: $("note").value }) });
  const data = await r.json();
  if (!r.ok) { $("err").textContent = data.error; return; }
  render(data);
}
$("accept").onclick = () => respond("accept");
$("decline").onclick = () => respond("decline");

fetch(`/api/q/${id}`).then(async (r) => {
  if (!r.ok) { $("root").innerHTML = "<p>This quote could not be found.</p>"; return; }
  render(await r.json());
});
</script>
</body>
</html>
